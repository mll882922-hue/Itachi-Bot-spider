name: Unzip Bot

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and Unzip
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "❌ لم يتم العثور على ZIP"
            exit 1
          fi

          echo "✅ ZIP: $ZIP_FILE"

          rm -rf extracted
          mkdir extracted

          unzip -o "$ZIP_FILE" -d extracted

          TOP_DIRS=$(find extracted -mindepth 1 -maxdepth 1 -type d | wc -l)
          TOP_FILES=$(find extracted -mindepth 1 -maxdepth 1 -type f | wc -l)

          if [ "$TOP_DIRS" -eq 1 ] && [ "$TOP_FILES" -eq 0 ]; then
            FIRST_DIR=$(find extracted -mindepth 1 -maxdepth 1 -type d -print -quit)
            SOURCE="$FIRST_DIR"
          else
            SOURCE="extracted"
          fi

          echo "📦 Source: $SOURCE"

          # نسخ ملفات البوت مع تجاهل GitHub Workflows
          rsync -av \
            --exclude='.github/workflows/' \
            "$SOURCE"/ ./

          rm -rf extracted
          rm -f "$ZIP_FILE"

          echo "✅ تم فك ملفات البوت بنجاح"

      - name: Commit files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          git commit -m "Extract bot files" || echo "Nothing to commit"

          git push
